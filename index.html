<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=showcase/">
  <title>ORBIT Showcase</title>
  <link rel="canonical" href="showcase/">
  <style>
    :root {
      color-scheme: dark;
      --bg: #061426;
      --text: #f6fdff;
      --accent: #6ff4da;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 30%, rgba(66, 215, 255, 0.18), transparent 36%),
        linear-gradient(180deg, #061426, #071a2a);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(92vw, 520px);
      padding: 36px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: rgba(246, 253, 255, 0.76);
      line-height: 1.7;
    }

    a {
      color: var(--accent);
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <h1>Opening ORBIT Showcase</h1>
    <p>If you are not redirected automatically, <a href="showcase/">open the showcase</a>.</p>
  </main>
  <script>
    window.location.replace("showcase/" + window.location.search + window.location.hash);
  </script>
</body>
</html>
